<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JARVIS OS">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eceef3">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JARVIS OS — Monsef</title>
<style>
/* Nouvelle interface : verre clair, une seule page visible à la fois. Même données que la version classique. */
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#16161d;--ink2:#4a4a5a;--mut:#6b6b7b;--faint:#8a8a9a;--line:rgba(30,30,60,.08);--vio:#7c6cf0;--bg:#eceef3;--green:#1fb981;--amber:#f0a020;--blue:#4a9af5;color-scheme:light}
html,body{height:100%}
body{font-family:'Manrope',-apple-system,'SF Pro Display',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.bgf{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgf i{position:absolute;display:block}
.glass{background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);border:1px solid rgba(255,255,255,.95);border-radius:30px;box-shadow:0 14px 44px rgba(50,50,100,.09),0 1px 2px rgba(50,50,100,.05)}
.big{font-weight:200;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.lbl{font-size:12px;color:var(--mut);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.7);font-size:13px;font-weight:600}
.chip i{width:8px;height:8px;border-radius:50%;display:block}
.btn{border:0;border-radius:99px;font-size:15px;font-weight:600;padding:14px 28px}
.btn.dk{background:var(--ink);color:#fff}
.btn.lt{background:rgba(255,255,255,.75);color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--vio);outline-offset:2px}
/* en-tête */
.top{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:16px 36px;padding-top:max(16px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;border:0;background:none;text-align:left}
.brand .gem{width:42px;height:42px;border-radius:50%;background:#0b0b1c;box-shadow:0 8px 22px rgba(60,50,160,.35),inset 0 0 0 1px rgba(255,255,255,.14);overflow:hidden;position:relative;flex:none}
.brand .gem canvas{position:absolute;inset:0;width:100%;height:100%}
.brand b{display:block;font-size:14px;letter-spacing:.18em;font-weight:700}
.brand span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-weight:500;margin-top:2px}
.brand span i{width:6px;height:6px;border-radius:50%;background:var(--green);display:block}
nav.nv{display:flex;gap:2px;padding:5px;border-radius:99px}
nav.nv button{border:0;background:transparent;font-size:13px;font-weight:600;color:#5a5a6a;padding:9px 17px;border-radius:99px;transition:background .2s,color .2s}
nav.nv button.on{background:var(--ink);color:#fff}
.right{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.old{font-size:12px;font-weight:600;color:var(--ink2);text-decoration:none;padding:10px 16px;border-radius:99px}
.wrap{position:relative;z-index:2;max-width:1320px;margin:0 auto;padding:6px 36px 60px}
.page{display:none}.page.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1.pt{font-size:40px;font-weight:200;letter-spacing:-.04em}
.sub{font-size:15px;color:var(--ink2);margin-top:10px}
/* accueil */
.msg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center;padding:26px 32px;background:radial-gradient(120% 140% at 0% 0%,#1e1650,#0b0b1c 70%);color:#fff;border-color:rgba(255,255,255,.18)}
.msg .orbbox{width:132px;height:132px;position:relative}
.msg canvas{position:absolute;inset:0;width:100%;height:100%}
.msg .who{font-size:12px;letter-spacing:.18em;font-weight:700;opacity:.7}
.msg .txt{font-size:26px;font-weight:300;letter-spacing:-.025em;line-height:1.28;margin-top:8px}
.msg .txt b{font-weight:600}
.grid3{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;margin-top:20px}
.col{display:flex;flex-direction:column;gap:20px}
.card{padding:26px 30px}
.card h2{font-size:16px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.card h2 small{font-size:12px;font-weight:500;color:var(--mut)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:32px;align-items:center;padding:36px 42px;background:linear-gradient(120deg,rgba(139,124,246,.28),rgba(244,114,182,.13) 55%,rgba(251,176,64,.28)),rgba(255,255,255,.62)}
.hero .k{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--ink2)}
.hero .k i{width:8px;height:8px;border-radius:50%;background:var(--vio);display:block}
.hero h3{font-size:42px;font-weight:300;letter-spacing:-.04em;line-height:1.08;margin-top:14px}
.hero .chips{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.hero .acts{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.ringbox{position:relative;width:200px;height:200px;justify-self:center}
.ringbox .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.todo{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .ck{width:26px;height:26px;border-radius:50%;border:2px solid rgba(30,30,60,.2);background:transparent;display:grid;place-items:center;font-size:13px;color:#fff;padding:0;transition:all .15s}
.row .ck.on{background:var(--ink);border-color:var(--ink)}
.row b{display:block;font-size:15px;font-weight:600}
.row span.s{font-size:12px;color:var(--mut)}
.row .tag{font-size:12px;font-weight:600;color:var(--mut);white-space:nowrap}
.row .tag.late{color:#d9453d}
.row.done b{text-decoration:line-through;color:var(--faint);font-weight:500}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.add{display:flex;gap:10px;margin-top:14px}
.add input{flex:1;min-width:0;border:1px solid rgba(30,30,60,.12);background:rgba(255,255,255,.7);border-radius:99px;padding:12px 18px;font:inherit;font-size:14px;color:var(--ink)}
.add button{border:0;border-radius:99px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;padding:0 20px}
.rings{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 10px;margin-top:10px}
.rg{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--mut);font-weight:500}
.rg .r{position:relative;width:64px;height:64px}
.rg .r span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink)}
.empty{padding:18px 0;color:var(--mut);font-size:14px}
/* calendrier */
.week{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wd{width:78px;padding:12px 0 10px;border-radius:24px;text-align:center;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9);transition:all .2s}
.wd.on{background:var(--ink);color:#fff;box-shadow:0 12px 30px rgba(22,22,29,.25);border-color:var(--ink)}
.wd small{display:block;font-size:11px;font-weight:600;opacity:.65}
.wd em{display:block;font-style:normal;font-size:24px;font-weight:300;letter-spacing:-.03em;margin:2px 0 8px}
.wd .dd{display:flex;gap:3px;justify-content:center;height:5px}
.wd .dd i{width:5px;height:5px;border-radius:50%;background:var(--vio)}
.wd.on .dd i{background:#fff}
.arrow{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;padding:0;font-size:18px}
.ag{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;margin-top:22px}
.slot{display:grid;grid-template-columns:96px 10px minmax(0,1fr) auto;gap:14px;align-items:flex-start;padding:15px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot time{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;padding-top:1px}
.slot i{width:9px;height:9px;border-radius:50%;margin-top:6px}
.slot b{display:block;font-size:15px;font-weight:600}
.slot span{font-size:12px;color:var(--mut)}
.x{border:0;background:transparent;color:var(--faint);font-size:18px;line-height:1;padding:2px 6px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.form input,.form select{border:1px solid rgba(30,30,60,.12);background:rgba(255,255,255,.7);border-radius:16px;padding:11px 14px;font:inherit;font-size:14px;color:var(--ink);min-width:0}
.form .full{grid-column:1/-1}
/* projets */
.pg{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:24px}
.proj{padding:26px 30px 20px;display:flex;flex-direction:column;gap:16px;cursor:pointer;text-align:left;width:100%;border:1px solid rgba(255,255,255,.95)}
.proj:hover{transform:translateY(-2px)}
.proj .nm{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;letter-spacing:-.02em}
.proj .nm i{width:10px;height:10px;border-radius:50%;display:block}
.seg{display:flex;gap:5px}
.seg i{flex:1;height:6px;border-radius:99px;background:rgba(30,30,60,.12);display:block}
.seg i.on{background:var(--ink)}
.nxt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.nxt .n{font-size:26px;font-weight:200;color:#b0b0be}
.nxt.first .n{color:var(--vio)}
.nxt.first span{font-size:15px;font-weight:600}
.nxt span{font-size:14px;color:var(--mut)}
.detail{display:grid;grid-template-columns:330px minmax(0,1fr);gap:36px;align-items:start;margin-top:10px}
.step{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 4px;border-top:1px solid var(--line)}
.step .n{font-size:28px;font-weight:200;color:#b0b0be}
.step b{font-size:16px;font-weight:500}
.step.done b{text-decoration:line-through;text-decoration-color:rgba(107,107,123,.5);color:var(--faint)}
.step .ck{width:26px;height:26px;border-radius:50%;border:2px solid rgba(30,30,60,.2);background:transparent;display:grid;place-items:center;font-size:13px;color:#fff;padding:0}
.step .ck.on{background:var(--ink);border-color:var(--ink)}
.back{border:0;background:none;font-size:13px;font-weight:600;color:var(--vio);padding:0;margin-bottom:6px}
/* jarvis */
body.night{background:#070716}
body.night .bgf{display:none}
body.night .brand,body.night .old{color:#fff}
body.night .brand span{color:rgba(255,255,255,.6)}
body.night .glass.nv,body.night .old.glass,body.night .mnav{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);box-shadow:none}
body.night nav.nv button,body.night .mnav button{color:rgba(255,255,255,.7)}
body.night nav.nv button.on,body.night .mnav button.on{background:#fff;color:#14122f}
.stage{position:relative;height:calc(100vh - 118px);min-height:560px;border-radius:34px;overflow:hidden;background:radial-gradient(90% 70% at 50% 85%,#241a63 0%,#0f0b2d 55%,#06061a 100%);border:1px solid rgba(255,255,255,.1)}
.plat{position:absolute;left:50%;bottom:-12%;width:130%;height:46%;transform:translateX(-50%);border-radius:50%/60%;background:linear-gradient(180deg,rgba(150,140,255,.22),rgba(60,50,150,.12) 60%,transparent);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 -20px 80px rgba(120,100,255,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.oB{position:absolute;left:50%;bottom:16%;width:min(46vh,420px);aspect-ratio:1;transform:translateX(-50%)}
.oB canvas{position:absolute;inset:0;width:100%;height:100%}
.win{position:absolute;top:9%;width:min(27%,300px);padding:20px 22px;border-radius:26px;color:#fff;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);box-shadow:0 24px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.win.l{left:4%;transform:perspective(900px) rotateY(14deg)}
.win.r{right:4%;transform:perspective(900px) rotateY(-14deg)}
.win .wl{font:600 11px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;opacity:.65;margin-bottom:12px}
.win .wi{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;padding:7px 0;border-top:1px solid rgba(255,255,255,.1)}
.win .wi:first-of-type{border-top:0}
.win .wi i{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
.cap{position:absolute;left:50%;top:7%;transform:translateX(-50%);width:min(60%,640px);text-align:center;font-size:22px;font-weight:300;color:rgba(255,255,255,.9);min-height:60px;line-height:1.35;pointer-events:none}
.cap b{font-weight:500;color:#fff}
.dock{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(92%,640px);display:flex;gap:10px;align-items:center;padding:8px 8px 8px 22px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.dock input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:inherit;font-size:15px}
.dock input::placeholder{color:rgba(255,255,255,.55)}
.dock button{border:0;border-radius:99px;background:#fff;color:#14122f;font-weight:600;font-size:14px;padding:11px 20px}
.st{position:absolute;right:20px;top:18px;display:flex;gap:6px}
.st button{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:rgba(255,255,255,.75);font-size:12px;font-weight:600;border-radius:99px;padding:7px 13px}
.st button.on{background:#fff;color:#14122f}
.corps{height:calc(100vh - 118px);min-height:520px;border-radius:30px;overflow:hidden;background:#0a0a0a;border:1px solid rgba(255,255,255,.9)}
.corps iframe{width:100%;height:100%;border:0;display:block}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;z-index:100;animation:tt 2.4s ease forwards;pointer-events:none}
@keyframes tt{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
@media (max-width:1000px){.top{padding:14px 20px;grid-template-columns:auto 1fr}.top nav.nv{display:none}.wrap{padding:6px 18px 110px}
 .grid3,.ag,.pg,.detail{grid-template-columns:1fr}.hero{grid-template-columns:1fr;padding:28px}.ringbox{display:none}.hero h3{font-size:32px}
 .msg{grid-template-columns:1fr;padding:22px}.msg .orbbox{width:96px;height:96px}.msg .txt{font-size:21px}
 .mnav{display:flex}.win{display:none}.oB{bottom:24%}.cap{font-size:18px;top:11%}}
.mnav{display:none;position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:40;justify-content:space-between;padding:6px;border-radius:99px}
.mnav button{border:0;background:transparent;font-size:11px;font-weight:600;color:#5a5a6a;padding:10px 8px;border-radius:99px;flex:1}
.mnav button.on{background:var(--ink);color:#fff}
@media (prefers-reduced-motion:reduce){.page.on{animation:none}.toast{animation:none}}
</style>
</head>
<body>
<div class="bgf" aria-hidden="true"><i style="left:-8%;top:-16%;width:60%;height:64%;background:radial-gradient(closest-side,rgba(139,124,246,.34),transparent)"></i><i style="right:-10%;top:-6%;width:46%;height:46%;background:radial-gradient(closest-side,rgba(74,154,245,.2),transparent)"></i><i style="right:-6%;bottom:-20%;width:60%;height:60%;background:radial-gradient(closest-side,rgba(251,176,64,.3),transparent)"></i></div>

<header class="top">
  <button class="brand" data-go="accueil" aria-label="JARVIS, retour à l'accueil"><span class="gem"><canvas id="oH"></canvas></span><div><b>JARVIS</b><span><i></i>en ligne</span></div></button>
  <nav class="glass nv" aria-label="Navigation">
    <button data-go="accueil">Accueil</button><button data-go="calendrier">Calendrier</button><button data-go="projets">Projets</button><button data-go="jarvis">JARVIS</button><button data-go="mind">Mind</button><button data-go="corps">Corps</button>
  </nav>
  <div class="right"><a class="old glass" href="classique.html" style="border-radius:99px">Version classique</a></div>
</header>

<main class="wrap">
  <section class="page" id="p-accueil" aria-label="Accueil">
    <div class="glass msg"><div class="orbbox"><canvas id="oM"></canvas></div><div><div class="who">JARVIS</div><div class="txt" id="hello"></div></div></div>
    <div class="grid3">
      <div class="col">
        <section class="glass hero" id="hero"></section>
        <section class="glass card"><h2>À faire <small id="todoCount"></small></h2><div class="todo" id="todo"></div><form class="add" id="addM"><input id="addMt" placeholder="Ajouter une mission…" aria-label="Nouvelle mission" autocomplete="off"><input id="addMd" type="date" aria-label="Échéance" style="flex:none;width:150px"><button type="submit">Ajouter</button></form></section>
      </div>
      <div class="col">
        <section class="glass card"><h2>Équilibre du jour</h2><div class="rings" id="rings"></div></section>
        <section class="glass card" id="xpc"></section>
        <section class="glass card"><h2>Ensuite <small>aujourd'hui</small></h2><div id="nextUp"></div></section>
      </div>
    </div>
  </section>

  <section class="page" id="p-calendrier" aria-label="Calendrier"></section>
  <section class="page" id="p-projets" aria-label="Projets"></section>
  <section class="page" id="p-jarvis" aria-label="JARVIS">
    <div class="stage" id="stage">
      <div class="st" role="group" aria-label="État de JARVIS"><button data-m="idle" class="on">Veille</button><button data-m="listen">Écoute</button><button data-m="think">Réfléchit</button><button data-m="speak">Parle</button></div>
      <div class="cap" id="cap" aria-live="polite"></div>
      <aside class="win l" aria-label="À faire"><div class="wl">À faire</div><div id="wTodo"></div></aside>
      <aside class="win r" aria-label="Prochain créneau"><div class="wl">Aujourd'hui</div><div id="wNext"></div></aside>
      <div class="plat" aria-hidden="true"></div>
      <div class="oB"><canvas id="oB"></canvas></div>
      <form class="dock" id="ask"><input id="askIn" placeholder="Parle à JARVIS…" aria-label="Message pour JARVIS" autocomplete="off"><button type="submit">Envoyer</button></form>
    </div>
  </section>
  <section class="page" id="p-corps" aria-label="Corps"><div class="corps"><iframe id="cf" title="Corps 3D" loading="lazy"></iframe></div></section>
</main>
<nav class="glass mnav" aria-label="Navigation mobile"><button data-go="accueil">Accueil</button><button data-go="calendrier">Agenda</button><button data-go="projets">Projets</button><button data-go="jarvis">JARVIS</button><button data-go="mind">Mind</button><button data-go="corps">Corps</button></nav>

<script>
(function(){
'use strict';
/* ═════ Données : même clé et même forme que la version classique ═════ */
var DEFAULT_PILLARS = [
  {id:'corps', name:'Corps', color:'#34d399', bg:'#0a2018', penalty:'Moins de 3 séances sport → Corps -1 niveau',
   habits:[
    {id:'c1', name:'Séance sport',        freq:'daily',  weight:2, weeklyTarget:null},
    {id:'c2', name:'Coucher avant minuit',freq:'daily',  weight:1, weeklyTarget:null},
    {id:'c3', name:'Réveil avant 9h',     freq:'daily',  weight:1, weeklyTarget:null},
  ]},
  {id:'esprit', name:'Esprit', color:'#a78bfa', bg:'#1a1030', penalty:'1 prière manquée = jour invalidé. 2 jours ratés → Esprit -1 niveau',
   habits:[
    {id:'e1', name:'Prière Fajr',   freq:'daily', weight:1, weeklyTarget:null},
    {id:'e2', name:'Prière Dohr',   freq:'daily', weight:1, weeklyTarget:null},
    {id:'e3', name:'Prière Asr',    freq:'daily', weight:1, weeklyTarget:null},
    {id:'e4', name:'Prière Maghrib',freq:'daily', weight:1, weeklyTarget:null},
    {id:'e5', name:'Prière Isha',   freq:'daily', weight:1, weeklyTarget:null},
    {id:'e6', name:'Lecture 30 min',freq:'daily', weight:2, weeklyTarget:null},
  ]},
  {id:'argent', name:'Argent', color:'#fbbf24', bg:'#1a1000', penalty:'',
   habits:[
    {id:'a1', name:'Session trading/backtest', freq:'daily', weight:2, weeklyTarget:null},
